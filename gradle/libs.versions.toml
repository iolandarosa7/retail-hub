[versions]
agp = "9.2.1"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-testExt = "1.3.0"
composeMultiplatform = "1.12.0"
core = "1.7.0"
coroutines = "1.11.0"
datastoreCore = "1.2.1"
koin = "4.2.2"
kotlin = "2.4.10"
kotlinx-serialization = "1.11.0"
ktor = "3.5.2"
material3 = "1.12.0-alpha03"
mokkery = "3.4.2"
multiplatform-nav3-ui = "1.2.0-alpha02"
runner = "1.7.0"
turbine = "1.2.1"
spotless = "8.10.1"
detekt = "1.23.8"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core = { group = "androidx.test", name = "core", version.ref = "core" }
androidx-datastore-core = { module = "androidx.datastore:datastore-core", version.ref = "datastoreCore" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastoreCore" }
